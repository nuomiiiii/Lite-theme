<!doctype html>
<html>
  <head>
    <script>
      // 在页面渲染前就执行主题初始化
      try {
        const storageKey = "vite-ui-theme"
        let theme = localStorage.getItem(storageKey)
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.classList.add(theme)
      } catch (e) {
        document.documentElement.classList.add("light")
      }
      const isIOS =
        /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      const standalone = isIOS
        ? window.navigator.standalone === true
        : Boolean(
            window.matchMedia?.("(display-mode: standalone)").matches ||
              window.matchMedia?.("(display-mode: fullscreen)").matches,
          )
      document.documentElement.classList.toggle("lite-standalone", Boolean(standalone))
    </script>
    <style>
      /* Prevent FOUC in Safari */
      html:not(.dark):not(.light) * {
        visibility: hidden;
      }

      :root {
        color-scheme: light;
        --bg: #F4F7F9;
      }

      html.dark {
        color-scheme: dark;
        --bg: #141B21;
      }

      html.light {
        color-scheme: light;
        --bg: #F4F7F9;
      }

      html {
        background-color: var(--bg) !important;
      }

      body {
        background-color: var(--bg) !important;
      }

      #root {
        background-color: var(--bg) !important;
        visibility: hidden;
      }

      #root.loaded {
        visibility: visible;
        animation: fadein 0.2s;
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <script>
      ;(function () {
        const storageKey = "vite-ui-theme"
        const theme = localStorage.getItem(storageKey) || "system"
        const root = document.documentElement

        function updateThemeColor(isDark) {
          const themeColor = isDark ? "#141B21" : "#FFFFFF"
          let meta = document.querySelector('meta[name="theme-color"]')
          if (!meta) {
            meta = document.createElement("meta")
            meta.setAttribute("name", "theme-color")
            document.head.appendChild(meta)
          }
          meta.setAttribute("content", themeColor)
        }

        function setTheme(newTheme) {
          root.classList.remove("light", "dark")
          root.classList.add(newTheme)
          updateThemeColor(newTheme === "dark")
        }

        if (theme === "system") {
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          setTheme(systemTheme)

          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            setTheme(e.matches ? "dark" : "light")
          })
        } else {
          setTheme(theme)
        }

        // Add loaded class after React has mounted
        window.addEventListener("load", () => {
          const root = document.getElementById("root")
          if (root) {
            // 使用 RAF 确保在下一帧渲染
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                root.classList.add("loaded")
              })
            })
          }
        })
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png?v=lite-icon-0e86dd" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const standalone = document.documentElement.classList.contains("lite-standalone")
        const viewport = document.querySelector('meta[name="viewport"]')
        if (viewport) {
          viewport.setAttribute(
            "content",
            standalone
              ? "width=device-width, initial-scale=1.0, viewport-fit=cover"
              : "width=device-width, initial-scale=1.0",
          )
        }
        const syncViewportHeight = () => {
          if (document.documentElement.classList.contains("lite-standalone")) {
            document.documentElement.style.removeProperty("--app-viewport-height")
            return
          }
          const height = window.visualViewport?.height || window.innerHeight
          if (height) {
            document.documentElement.style.setProperty("--app-viewport-height", `${Math.round(height)}px`)
          }
        }
        syncViewportHeight()
        window.visualViewport?.addEventListener("resize", syncViewportHeight)
        window.visualViewport?.addEventListener("scroll", syncViewportHeight)
      })()
    </script>
    <title>Lite</title>
    <meta name="description" content="Lite server monitor." />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=lite-icon-0e86dd" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
